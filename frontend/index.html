<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DeepTrace | Forensic Deepfake Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap" rel="stylesheet">
    <style>
        :root {
            --surface: #0e1419;
            --surface-container: #1a2026;
            --surface-container-high: #252b30;
            --on-surface: #dee3ea;
            --on-surface-variant: #c1c6d7;
            --primary: #00daf3;
            --primary-container: #009fb2;
            --on-primary: #00363d;
            --error: #ffb4ab;
            --error-container: #93000a;
            --tertiary: #b5c9dc;
            --on-tertiary-container: #192b3a;
            --font-headline: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--surface);
            color: var(--on-surface);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Glass Panel Styling */
        .glass-panel {
            background: rgba(26, 32, 38, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(65, 71, 84, 0.15);
            border-radius: var(--radius-2xl);
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: var(--font-headline);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .text-primary { color: var(--primary); }
        .text-muted { color: var(--on-surface-variant); font-size: 0.9rem; }

        /* Upload Dropzone */
        .upload-dropzone {
            background-color: #090f14;
            border: 2px dashed rgba(65, 71, 84, 0.3);
            border-radius: var(--radius-xl);
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .upload-dropzone:hover, .upload-dropzone.dragover {
            border-color: var(--primary);
            background-color: rgba(0, 218, 243, 0.05);
        }

        .upload-icon-wrapper {
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            background: var(--surface-container-high);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        #fileInput { display: none; }

        /* Preview State */
        .preview-container {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
            background: #000;
            display: none;
            margin-bottom: 1.5rem;
        }

        .preview-container img, .preview-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Scanline Animation */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            box-shadow: 0 0 15px var(--primary);
            animation: scanline 4s linear infinite;
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(300px); }
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: var(--radius-lg);
            font-family: var(--font-headline);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-container));
            color: var(--on-primary);
            box-shadow: 0 0 20px rgba(0, 218, 243, 0.15);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 218, 243, 0.3);
        }

        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-secondary {
            background: var(--surface-container-high);
            color: var(--on-surface);
            margin-top: 1rem;
        }

        /* Results Display */
        #results {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(65, 71, 84, 0.2);
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .circular-chart {
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem;
            transform: rotate(-90deg);
        }

        .circle-bg { fill: none; stroke: var(--surface-container-high); stroke-width: 3; }
        .circle {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease-out;
            stroke-dasharray: 552.92;
            stroke-dashoffset: 552.92;
        }

        /* Result Colors */
        .status-fake { stroke: var(--error); color: var(--error); }
        .status-likely-fake { stroke: var(--warning); color: #ffaa33; }
        .status-likely-real { stroke: #7ecf7e; color: #7ecf7e; }
        .status-real { stroke: var(--primary); color: var(--primary); }

        .result-chip {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: var(--radius-lg);
            font-family: var(--font-headline);
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            background: rgba(0,0,0,0.2);
        }

        .result-desc {
            color: var(--on-surface-variant);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Error Message */
        #errorMsg {
            color: var(--error);
            background: var(--error-container);
            padding: 0.75rem;
            border-radius: var(--radius-lg);
            margin-top: 1rem;
            font-size: 0.85rem;
            display: none;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .material-symbols-outlined { font-size: 24px; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <header>
            <h1>DeepTrace <span class="text-primary">Detection</span></h1>
            <p class="text-muted">Forensic Media Validation Engine</p>
        </header>

        <!-- Upload Section -->
        <div id="uploadArea">
            <div id="dropzone" class="upload-dropzone">
                <div id="emptyState" class="items-center flex flex-col">
                    <div class="upload-icon-wrapper">
                        <span class="material-symbols-outlined">cloud_upload</span>
                    </div>
                    <p>Drag & drop or click to browse</p>
                    <p style="font-size: 0.7rem; margin-top: 0.5rem; opacity: 0.6;">MP4, MOV, JPG, PNG</p>
                </div>

                <div id="previewContainer" class="preview-container">
                    <div id="scanline" class="scan-line"></div>
                </div>

                <input type="file" id="fileInput" accept="image/*,video/*">
            </div>

            <div id="fileInfo" style="display: none; margin-bottom: 1.5rem; text-align: left;">
                <p id="filename" style="font-weight: 600; font-size: 0.9rem;"></p>
                <p id="filesize" style="font-size: 0.8rem; opacity: 0.6;"></p>
            </div>

            <button id="analyzeBtn" class="btn btn-primary" disabled>
                <span id="btnText">Analyze Artifact</span>
                <span id="btnIcon" class="material-symbols-outlined">arrow_forward</span>
            </button>

            <div id="errorMsg"></div>
        </div>

        <!-- Results Section -->
        <div id="results">
            <svg class="circular-chart" viewBox="0 0 192 192">
                <circle class="circle-bg" cx="96" cy="96" r="88" />
                <circle id="resCircle" class="circle" cx="96" cy="96" r="88" />
            </svg>
            
            <div id="resChip" class="result-chip">--</div>
            <p id="resDesc" class="result-desc">--</p>

            <button id="resetBtn" class="btn btn-secondary">
                <span class="material-symbols-outlined">refresh</span>
                Analyze Another
            </button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/predict';
        
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const emptyState = document.getElementById('emptyState');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resCircle = document.getElementById('resCircle');
        const scanline = document.getElementById('scanline');
        const errorMsg = document.getElementById('errorMsg');

        let currentFile = null;

        // Interaction
        dropzone.onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => handleFiles(e.target.files);

        dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
        dropzone.ondragleave = () => dropzone.classList.remove('dragover');
        dropzone.ondrop = (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        };

        function handleFiles(files) {
            if (!files.length) return;
            const file = files[0];
            
            // Validation
            if (!['image/jpeg', 'image/png', 'video/mp4', 'video/quicktime'].includes(file.type)) {
                showError("Unsupported format. Use JPG, PNG, or MP4.");
                return;
            }

            currentFile = file;
            hideError();
            
            // UI Update
            emptyState.style.display = 'none';
            previewContainer.style.display = 'block';
            analyzeBtn.disabled = false;
            document.getElementById('fileInfo').style.display = 'block';
            document.getElementById('filename').textContent = file.name;
            document.getElementById('filesize').textContent = `${(file.size / 1024 / 1024).toFixed(1)} MB`;

            // Clear old previews
            const old = previewContainer.querySelector('.media-item');
            if (old) old.remove();

            const media = document.createElement(file.type.startsWith('image') ? 'img' : 'video');
            media.className = 'media-item';
            media.src = URL.createObjectURL(file);
            if (media.tagName === 'VIDEO') { media.muted = true; media.play(); }
            previewContainer.appendChild(media);
        }

        analyzeBtn.onclick = async () => {
            if (!currentFile) return;

            // Loading state
            analyzeBtn.disabled = true;
            document.getElementById('btnText').textContent = 'Analyzing...';
            document.getElementById('btnIcon').textContent = 'sync';
            document.getElementById('btnIcon').classList.add('animate-spin');
            scanline.style.display = 'block';

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const res = await fetch(API_URL, { method: 'POST', body: formData });
                if (!res.ok) throw new Error("Backend connection failed.");
                
                const data = await res.json();
                renderResults(data);
            } catch (err) {
                showError(err.message === 'Failed to fetch' ? "Backend offline (Check app.py)" : err.message);
            } finally {
                analyzeBtn.disabled = false;
                document.getElementById('btnText').textContent = 'Analyze Artifact';
                document.getElementById('btnIcon').textContent = 'arrow_forward';
                document.getElementById('btnIcon').classList.remove('animate-spin');
                scanline.style.display = 'none';
            }
        };

        function renderResults(data) {
            const { score, label } = data;
            document.getElementById('uploadArea').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            
            const chip = document.getElementById('resChip');
            chip.textContent = `${label} (${score}%)`;
            
            // Color Mapping
            const slug = label.toLowerCase().replace(' ', '-');
            resCircle.className = `circle status-${slug}`;
            chip.className = `result-chip status-${slug}`;

            // Description Logic
            const desc = {
                'Fake': 'High-probability synthetic artifacts identified. Neural consistency check failed.',
                'Likely Fake': 'Moderate-probability artifacts detected. Digital fingerprints suggest modification.',
                'Likely Real': 'Low-probability manipulation indicators. Metadata is mostly organic.',
                'Real': 'Authentic artifact verified. No synthetic manipulation detected.'
            }[label];
            document.getElementById('resDesc').textContent = desc;

            // Animate Circle
            const circumference = 552.92;
            const offset = circumference - (score / 100 * circumference);
            setTimeout(() => { resCircle.style.strokeDashoffset = offset; }, 100);
        }

        document.getElementById('resetBtn').onclick = () => {
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            emptyState.style.display = 'flex';
            previewContainer.style.display = 'none';
            document.getElementById('fileInfo').style.display = 'none';
            analyzeBtn.disabled = true;
            resCircle.style.strokeDashoffset = 552.92;
        };

        function showError(m) { errorMsg.textContent = m; errorMsg.style.display = 'block'; }
        function hideError() { errorMsg.style.display = 'none'; }
    </script>
</body>
</html>
